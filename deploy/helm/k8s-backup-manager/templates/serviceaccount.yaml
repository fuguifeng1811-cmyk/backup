{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-backup-manager.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-backup-manager.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: "Service account for backup manager with minimal permissions"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# 禁用自动挂载 ServiceAccount token，使用时按需挂载
automountServiceAccountToken: false
{{- end }}
