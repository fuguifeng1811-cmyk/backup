apiVersion: batch/v1
kind: Job
metadata:
  name: k8s-backup-manager-discover
spec:
  template:
    spec:
      containers:
        - name: backup-manager
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          env:
            - name: LOG_LEVEL
              value: INFO
